[flake8]
max-line-length = 100
ignore = W503,E203

[isort]
known_first_party = noisebackup
known_third_party = aprl,gym,gym_compete,numpy,pandas,matplotlib,pytest,stable_baselines
force_sort_within_sections = True
force_grid_wrap = 0
include_trailing_comma = True
line_length = 100
multi_line_output = 3
use_parentheses = True

[tool:pytest]
testpaths = tests
markers =
    slow: runs real MuJoCo games (seconds to minutes); skip with -m "not slow"
filterwarnings =
    ignore::DeprecationWarning
    ignore::FutureWarning
    ignore::PendingDeprecationWarning
    # Harmless: the image's 2019 packages were compiled against a different numpy build.
    ignore:numpy.ufunc size changed:RuntimeWarning
